# OTG Rescue Toolkit — настройки (Windows)
# Можно переопределить переменными окружения OTG_ADB_BIN / OTG_FB_BIN / OTG_WORKDIR / OTG_LOGDIR / OTG_ALLOW_NET.
# Если adb/fastboot нет по указанному пути, скрипт поищет их в PATH.

ADB_BIN=D:\platform-tools\adb.exe
FB_BIN=D:\platform-tools\fastboot.exe
WORKDIR=D:\GoldenFrog\OTG_ToolKit\
LOGDIR=D:\GoldenFrog\OTG_ToolKit\logs\

# 1 — разрешить устройства по Wi-Fi-отладке (по умолчанию только USB)
ALLOW_NET=0
